{% extends 'base.html' %}

{% block content %}
<div class="content-wrapper">
    <h2 class="mb-4">Sửa Bài Viết</h2>
    
    <form method="POST" action="">
        <div class="mb-3">
            <label class="form-label fw-bold">Tiêu đề bài viết</label>
            <input type="text" name="title" class="form-control form-control-lg" required value="{{ post.title }}">
        </div>
        
        <div class="mb-4">
            <label class="form-label fw-bold">Nội dung</label>
            <textarea name="content" class="form-control" rows="15" required>{{ post.content }}</textarea>
        </div>
        
        <div class="d-flex justify-content-between">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Hủy bỏ</a>
            <button type="submit" class="btn btn-dark px-4">Cập nhật lưu</button>
        </div>
    </form>
</div>
{% endblock %}
